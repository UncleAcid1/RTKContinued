<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150">
  <!-- STATUS BANNER: to change phase, edit the label, the colors and the three steps below -->
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#2b1d12"/><stop offset="1" stop-color="#3c2a18"/></linearGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="998" height="148" rx="16" fill="url(#bg)" stroke="#ffb347" stroke-width="2"/>
  <circle cx="52" cy="48" r="9" fill="#ffd166"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="76" y="56" font-family="Georgia,serif" font-size="26" font-weight="bold" fill="#ffd166">PLAYABLE START TO FINISH  ·  BUG-HUNTING PHASE</text>
  <text x="40" y="88" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#e9dcc7">Almost everything is ported and the whole game can be played through. Bugs are being logged live.</text>
  <!-- pipeline -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="40" y="108" width="215" height="26" rx="13" fill="url(#bar)"/><text x="147" y="126" fill="#2b1d12">1 · PORTED ✔</text>
    <rect x="270" y="108" width="215" height="26" rx="13" fill="url(#bar)"/><text x="377" y="126" fill="#2b1d12">2 · PLAYABLE ✔</text>
    <rect x="500" y="108" width="260" height="26" rx="13" fill="#ffb347"/><text x="630" y="126" fill="#2b1d12">3 · BUG HUNT  ◀ we are here</text>
    <rect x="775" y="108" width="185" height="26" rx="13" fill="none" stroke="#8a7458" stroke-dasharray="5 4"/><text x="867" y="126" fill="#b8a388" font-weight="normal">4 · POLISHED</text>
  </g>
</svg>
