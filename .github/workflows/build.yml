# Builds Rule the Kingdom for Linux and Windows on every push; the packages are the run's artifacts
# (tools/package_linux.sh, tools/package_windows.sh). The Mac DMG stays a local build
# (tools/make_dmg.sh): macOS runners cost ten times the free minutes.
# SDL 3.4 is built from source on both (the game uses 3.4's pinch events and file dialogs).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch replaces a build still running (it saves minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_TAG: release-3.4.18

jobs:
  linux:
    # 22.04: an older glibc, so the build runs on most distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libpugixml-dev libpng-dev libjpeg-turbo8-dev \
            libvorbis-dev libogg-dev zlib1g-dev libgl-dev libegl-dev libgles-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev
      - name: SDL3
        run: |
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git sdl
          cmake -S sdl -B sdl/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl-install"
          cmake --build sdl/build
          cmake --install sdl/build
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_PREFIX_PATH="$PWD/sdl-install"
          cmake --build build -- -k 0
      - name: Package
        run: |
          export LD_LIBRARY_PATH="$PWD/sdl-install/lib"
          bash tools/package_linux.sh build dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: git zip
          pacboy: >-
            toolchain:p cmake:p ninja:p pugixml:p libpng:p libjpeg-turbo:p libvorbis:p libogg:p zlib:p
      - name: SDL3
        run: |
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git sdl
          cmake -S sdl -B sdl/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl-install"
          cmake --build sdl/build
          cmake --install sdl/build
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/sdl-install"
          cmake --build build -- -k 0
      - name: Package
        run: |
          export PATH="$PWD/sdl-install/bin:$PATH"
          bash tools/package_windows.sh build dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
